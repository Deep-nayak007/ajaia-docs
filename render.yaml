# Render Blueprint: New > Blueprint > pick this repo.
# Free plan has no persistent disk, so the SQLite file resets when the instance
# restarts or redeploys; demo users and sample docs are re-seeded on boot.
# For durable storage, switch to a paid plan and uncomment the disk below.
services:
  - type: web
    name: ajaia-docs
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # - key: DATABASE_PATH
      #   value: /var/data/app.db
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
